# Service
spring.application.name=quiz-service
server.port=8083

# --- Eureka registration (atelier Eureka, partie 2) ---
# EUREKA_CLIENT_SERVICEURL_DEFAULTZONE permet de surcharger l'URL (Docker), localhost par defaut
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Permet de lancer plusieurs instances : instance-id unique (nom:port)
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Actuator (atelier Observabilite) ---
# Exposer health, info, metrics et loggers (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics,loggers
# Afficher le detail des composants dans /health (db, diskSpace, rabbit, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (le service passe DOWN si un composant tombe)
eureka.client.healthcheck.enabled=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info
# Publier les proprietes info.* dans /actuator/info (desactive par defaut)
management.info.env.enabled=true
info.app.name=quiz-service
info.app.version=1.0.0
info.app.description=Microservice de gestion des quiz ecologiques
info.app.team=EcoSchool

# --- Base de donnees H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.datasource.url=jdbc:h2:mem:quiz_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
